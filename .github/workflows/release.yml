# Builds FitLedger.exe from the repository source in a clean GitHub
# environment and creates a DRAFT release with the files. The draft only
# becomes public when someone reviews and publishes it manually.
#
# Trigger: pushing a vX.Y.Z tag (or manually, only to test the build - in
# that case no release is created).
#
# Third-party actions are pinned by commit hash (not by tag, which can be moved).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write # create the draft release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (GNU) and MinGW-w64
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          if (-not (Get-Command windres -ErrorAction SilentlyContinue)) {
            if (Test-Path C:\mingw64\bin\windres.exe) {
              "C:\mingw64\bin" >> $env:GITHUB_PATH
            } else {
              C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
                mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
              "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
            }
          }

      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml."
          }

      # runs the tests, builds and checks the binary (the same script as the local build)
      - name: Release build
        shell: pwsh
        run: ./build-release.ps1

      - name: Assemble the files
        id: files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/fitledger.exe dist/FitLedger.exe
          Copy-Item THIRD-PARTY-LICENSES.txt, LICENSE dist/
          $hash = (Get-FileHash -Algorithm SHA256 dist/FitLedger.exe).Hash
          "FitLedger.exe SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/FitLedger.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FitLedger
          path: dist/
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.files.outputs.sha256 }}
        run: |
          # tag pushed again: the release already exists, do not create a second draft
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "A release for $env:GITHUB_REF_NAME already exists; no new draft was created." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $notes = @"
          **SHA-256 of FitLedger.exe:** ``$env:SHA256``

          Verify the build origin: ``gh attestation verify FitLedger.exe --repo $env:GITHUB_REPOSITORY``
          "@
          gh release create $env:GITHUB_REF_NAME dist/FitLedger.exe `
            dist/THIRD-PARTY-LICENSES.txt dist/LICENSE `
            --repo $env:GITHUB_REPOSITORY --draft `
            --title "FitLedger $env:GITHUB_REF_NAME" --notes "$notes" --generate-notes
