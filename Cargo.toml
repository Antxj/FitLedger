[package]
name = "fitledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local desktop sports diary: FIT import, running analysis, training plans and goals"
license = "GPL-3.0-or-later"
repository = "https://github.com/Antxj/FitLedger"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_plot = "0.37"
egui_extras = { version = "0.36", default-features = false, features = ["datepicker"] }
# date type of the egui_extras date picker (already a dependency of it)
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Analysis code is heavy on floating point loops: keep tests reasonably fast.
[profile.dev.package."*"]
opt-level = 2
